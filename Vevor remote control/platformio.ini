    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BusIO@^1.16.1
build_src_filter =
    +<../test/oled_test.cpp>

; Rotary Encoder Test Program (no external encoder library needed)
[env:encoder_test]
