; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sui77/rc-switch@^2.6.4
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    me-no-dev/ESPAsyncWebServer@^1.2.3
    me-no-dev/AsyncTCP@^1.1.1
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit SH110X@^2.1.8
    adafruit/Adafruit GFX Library@^1.11.3
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BusIO@^1.16.1
    ; TODO: Add OTA library when Arduino core is upgraded
    ; ayushsharma82/ElegantOTA@^2.2.9

; I2C Scanner Test Program (minimal, no libraries needed)
[env:i2c_test]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<../test/i2c_scanner.cpp>

; I2C Pin Test (tests different SDA/SCL combinations)
[env:pin_test]
platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<../test/pin_test.cpp>

; OLED Display Test Program
[env:oled_test]
